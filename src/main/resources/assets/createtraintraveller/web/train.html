<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Train details</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="main-header">

    <div class="header-text">
        <h1>Train Traveller</h1>
        <p>Real time train tracking</p>
    </div>
</header>

<nav class="navbar">
    <a href="index.html">Home</a>
    <a href="navigate.html">Routes</a>
</nav>

<div class="status-bar">
    <span id="serverStatus">🟢 Server Online</span>
    <span id="mcTime">Minecraft time: --:--</span>
</div>

<main class="container">

    <!-- HEADER TRENO -->
    <section class="card train-header-card">
        <div id="trainName">Loading...</div>
    </section>

    <!-- INFO TRENO (Tutto dentro un unico riquadro .card) -->
    <section class="card">
        <div id="trainInfo" class="stats-grid"></div>
    </section>

    <!-- PERCORSO -->
    <section class="card">
        <div class="section-header">
            <h3>Train Route</h3>
        </div>
        <table class="stop-list">
            <thead>
                <tr>
                    <th>Station</th>
                    <th>Platform</th>
                    <th>Arrival</th>
                    <th>Departure</th>
                </tr>
            </thead>
            <tbody id="stops"></tbody>
        </table>
    </section>

</main>

<script type="module" src="train.js"></script>

</body>

</html>
