<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Train Traveller</title>

    <link
        rel="stylesheet"
        href="style.css">
</head>

<body>

    <header class="main-header">

        <div class="header-text">

            <h1>Train Traveller</h1>

            <p>
                Real time train tracking
            </p>

        </div>

    </header>

    <nav class="navbar">

        <a href="index.html">
            Home
        </a>

        <a href="navigate.html">
            Routes
        </a>

    </nav>

    <div class="status-bar">

        <span id="serverStatus">

            🟢 Server Online

        </span>

        <span id="mcTime">

            Minecraft time: --:--

        </span>

    </div>

    <main class="container">

        <section
            id="dashboardStats"
            class="stats-grid">

        </section>

        <section class="card">

            <div class="section-header">

                <h2>
                    Station found
                </h2>

                <p>
                    Select a station to view the timetable.
                </p>

            </div>

            <div
                id="stationList"
                class="station-grid">

            </div>

        </section>

        <section class="card">

            <div class="section-header">

                <h2>
                    Trains in service
                </h2>

                <p>
                    Railway services currently running in the world.
                </p>

            </div>

            <div
                id="nextDepartures"
                class="departures-grid">

            </div>

        </section>

    </main>

    <script
        type="module"
        src="home.js">
    </script>

</body>

</html>
