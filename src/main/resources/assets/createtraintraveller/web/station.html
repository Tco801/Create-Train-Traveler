<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Station</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="main-header">
    <img
        src="https://cdn.modrinth.com/data/I8nHY8ll/4232f6ec6bc0516f23e2828a61a78998c49b5f3d.png"
        class="logo railcore-logo"
        alt="RailCore">

    <div class="header-text">
        <h1>Train Traveller</h1>
        <p>Real time train tracking</p>
    </div>
</header>

<nav class="navbar">
    <a href="index.html">Home</a>
    <a href="navigate.html">Routes</a>
</nav>

<div class="status-bar">
    <span id="serverStatus">🟢 Server Online</span>
    <span id="mcTime">Minecraft time: --:--</span>
</div>

<main class="container">
    <div class="card">
        <h2 id="stationTitle">Station</h2>
    </div>

    <div class="card station-board">
        <table class="departure-board">
            <thead>
                <tr>
                    <th>Category</th>
                    <th>Train</th>
                    <th>Destination</th>
                    <th>Arrival</th>
                    <th>Next Stops</th>
                    <th>Platform</th>
                </tr>
            </thead>
            <tbody id="board"></tbody>
        </table>
    </div>
</main>

<script type="module" src="station.js"></script>
</body>
</html>
