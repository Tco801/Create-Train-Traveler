
<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Routes - Train Traveller</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="main-header">
    <div class="header-text">
        <h1>Train Traveller</h1>
        <p>Routes finder</p>
    </div>
</header>

<nav class="navbar">
    <a href="index.html">Home</a>
    <a href="navigate.html" class="active">Routes</a>
</nav>

<div class="status-bar">
    <span id="serverStatus">🟢 Server Online</span>
    <span id="mcTime">Minecraft time: --:--</span>
</div>

<main class="container">
    <section class="card search-card">
        <h2>Find travell solutions</h2>
        
        <form id="searchForm" class="search-form">
            <div class="input-group">
                <label for="fromStation">Departure</label>
                <input 
                    id="fromStation" 
                    type="text" 
                    placeholder="e.g., Spawn Central" 
                    list="stationsList" 
                    autocomplete="off" 
                    required
                >
            </div>

            <button type="button" id="swapBtn" class="btn-swap" title="Inverti stazioni">⇄</button>

            <div class="input-group">
                <label for="toStation">Arrival</label>
                <input 
                    id="toStation" 
                    type="text" 
                    placeholder="e.g., Capitol city" 
                    list="stationsList" 
                    autocomplete="off" 
                    required
                >
            </div>

            <!-- Suggerimenti dinamici per le stazioni -->
            <datalist id="stationsList"></datalist>

            <button type="submit" id="searchBtn" class="btn-primary">
                Find Route
            </button>
        </form>
    </section>

    <!-- Contenitore Risultati -->
    <section id="results" class="results-container"></section>
</main>

<script type="module" src="navigate.js"></script>
</body>
</html>
