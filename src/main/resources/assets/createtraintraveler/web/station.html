<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Station Details - Create Train Traveler</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header id="globalHeader" class="main-header"></header>

    <main class="container">
        <div class="glass-panel">
            <h2 id="stationTitle" class="section-title" style="border-bottom: none; margin-bottom: 0;">Station</h2>
        </div>

        <div class="table-wrapper">
            <table class="glass-table">
                <thead>
                    <tr>
                        <th>Train</th>
                        <th>Category</th>
                        <th>Destination</th>
                        <th>Arrival</th>
                        <th>Departure</th>
                        <th>Delay</th>
                        <th>Infos</th>
                        <th>Platform</th>
                    </tr>
                </thead>
                <tbody id="board"></tbody>
            </table>
        </div>
    </main>

    <footer id="globalFooter" class="main-footer">
        <div>made by PlayerE464</div>
        <div>Create Train Traveler v0.0.5-alpha</div>
    </footer>

    <script type="module" src="station.js"></script>
</body>
</html>
